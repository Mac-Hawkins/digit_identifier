<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <!-- Need to use this script to use tensorflow.js -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <title>Digit Identifier</title>
  </head>
  <body>
    <div class="parallax-container">
      <div class="header-container">
        <h1 class="title">Digit Identifier</h1>
      </div>
    </div>
    <div class="canvas-container">
      <h2 class="centered-heading">Draw a Digit</h2>
      <p class="instructions-text">
        Draw a digit from 0-9 in the canvas below, then click "Predict" to see
        the model's result.
      </p>
      <canvas id="drawing-canvas"></canvas>
      <div class="submission-container">
        <div class="horizontal-buttons">
          <button id="predict-button" class="canvas-button">Predict</button>
          <button id="clear-button" class="canvas-button">Clear</button>
        </div>
        <div class="prediction-container">
          <p id="prediction-result" class="prediction-info">Prediction:</p>
          <p id="prediction-confidence" class="prediction-info">Confidence:</p>
        </div>
      </div>
    </div>
    <script type="module" src="script.js"></script>
  </body>
</html>
